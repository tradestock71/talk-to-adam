<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk to Adam</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#fff; --ink:#09161f; --line:#09161f; --text:#09161f; --mute:#3d4a55; --white:#fff; }
    * { box-sizing: border-box; }
    html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
    body { margin:0; background:#fff; color:var(--text); font-family:Outfit,system-ui,sans-serif; }
    .shell { height:100dvh; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:12px; }
    .panel, .chat { background:#fff; border-radius:28px; overflow:hidden; box-shadow:0 18px 50px rgba(9,22,31,.16); width:100%; height:100%; max-height:100%; min-height:0; }
    .panel { display:flex; flex-direction:column; }
    .brand { background:#09161f; text-align:center; padding:16px 18px 12px; }
    .brand img { width:min(184px,62%); height:auto; display:block; margin:0 auto 6px; }
    .brand p { margin:0; color:#d5dde4; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    .sheet { padding:16px 22px 18px; flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; background:#c5ccd4; }
    h1 { font-family:Fraunces,Georgia,serif; font-size:26px; font-weight:400; line-height:1.15; margin:0 0 10px; }
    .intro { font-size:16px; line-height:1.25; color:#09161f; margin:0 0 6px; }
    .intro strong { font-weight:500; }
    .intro .sub { display:inline-block; font-size:12px; line-height:1.3; margin:2px 0; }
    .intro .ask { font-weight:600; font-size:15px; white-space:nowrap; }
    label { display:block; font-size:9px; line-height:1.1; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:0; }
    .field { margin:0 0 3px; }
    input { width:100%; background:transparent; border:0; border-bottom:1px solid #b7c0c8; color:var(--text); font:400 16px Outfit,sans-serif; padding:1px 0 2px; line-height:1.2; outline:none; }
    input::placeholder { color:#5c6b78; }
    input:focus { border-bottom-color:#09161f; }
    .go, .talk { border:1px solid #09161f; border-radius:999px; background:#fff; color:#09161f; cursor:pointer; }
    .go { margin-top:8px; width:100%; font:500 16px Outfit,sans-serif; padding:13px 22px; position:relative; z-index:2; }
    .shot-frame { position:relative; width:100%; height:168px; overflow:hidden; border-radius:16px; margin:0 0 10px; background:#c5ccd4; }
    .shot-frame img { position:absolute; left:0; top:0; width:100%; height:auto; display:block; transform:translateY(-14.5%); pointer-events:none; }
    .shot-frame img.adam { height:100%; object-fit:cover; object-position:center 18%; transform:none; }
    .who { text-align:center; color:var(--mute); font-size:12px; margin:8px 0 0; }
    .err { color:#9a3b3b; font-size:14px; margin:0 0 12px; }
    .chat { display:flex; height:100%; min-height:0; flex-direction:column; }
    .log { flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:22px; display:flex; flex-direction:column; gap:14px; background:#c5ccd4; }
    .msg { max-width:80%; padding:13px 15px; border-radius:18px; font-size:15px; line-height:1.45; white-space:pre-wrap; }
    .them { align-self:flex-start; background:#fff; color:#09161f; border:1px solid #09161f; }
    .me { align-self:flex-end; background:#09161f; color:#fff; }
    .bar { display:flex; gap:10px; padding:14px 16px 16px; border-top:1px solid #d5dde4; background:#fff; }
    .bar input { flex:1; border:1px solid #09161f; border-bottom:1px solid #09161f; background:#fff; border-radius:999px; padding:13px 16px; color:#09161f; }
    .talk { padding:0 18px; font:500 14px Outfit,sans-serif; white-space:nowrap; }
    .talk:disabled { opacity:.35; }
    .consent { display:flex; align-items:flex-start; gap:9px; margin:4px 0 2px; padding:10px 12px; background:#09161f; border-radius:14px; color:rgba(255,255,255,.72); font-size:12px; line-height:1.4; letter-spacing:0; text-transform:none; cursor:pointer; }
    .consent input { flex:none; width:16px; height:16px; margin:1px 0 0; padding:0; border:0; accent-color:#58D6D2; cursor:pointer; }
    .consent a { color:#58D6D2; text-decoration:underline; text-underline-offset:2px; }
    .go:disabled { opacity:.45; cursor:not-allowed; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel" id="form">
      <header class="brand">
        <img src="logo.svg" alt="Inmo Andaluz" />
        <p>Talk to Adam</p>
      </header>
      <div class="sheet">
      <div class="shot-frame hidden" id="shot-frame"><img id="shot-form" alt="" /></div>
      <p class="intro">Hi, I’m <strong>Adam</strong>.<br /><span class="sub">I’ll be notified there’s a chat and you can talk to me here. If I’m not available, my AI assistant will answer.</span><br /><span class="ask">Please enter your name, email and phone.</span></p>
      <div class="field"><label for="n">Name</label><input id="n" autocomplete="name" /></div>
      <div class="field"><label for="t">Telephone</label><input id="t" autocomplete="tel" /></div>
      <div class="field"><label for="m">Email</label><input id="m" autocomplete="email" /></div>
      <label class="consent" for="ok"><input type="checkbox" id="ok" /><span>I agree to Inmo Andaluz keeping my details to reply to me. <a href="https://inmo-andaluz-website.vercel.app/privacy" target="_blank" rel="noopener noreferrer">Privacy policy</a></span></label>
      <p class="err hidden" id="err"></p>
      <button class="go" type="button" id="start" disabled>Talk to Adam</button>
      <p class="who">Inmo Andaluz · Costa del Sol</p>
      </div>
    </section>
    <section class="chat hidden" id="chat">
      <header class="brand">
        <img src="logo.svg" alt="Inmo Andaluz" />
        <p>Talk to Adam</p>
      </header>
      <div class="log" id="log"></div>
      <div class="bar">
        <input id="draft" autocomplete="off" placeholder="Type a message" />
        <button class="talk" type="button" id="send">Send</button>
      </div>
    </section>
  </div>
  <script>
    const KEY = "ywa.customer.thread.v1";
    const BUSES = [
      "https://ntfy.sh/inmo-andaluz-adam-live-v2",
      "https://ntfy.sh/inmo-andaluz-adam-talk-coin-2026",
      "https://ntfy.envs.net/inmo-andaluz-adam-live-v2",
    ];
    const MQTT_URL = "wss://broker.emqx.io:8084/mqtt";
    const MQTT_TOPIC = "inmo/andaluz/adam/live";
    function param(key) {
      try { return new URLSearchParams(location.search).get(key) || ""; } catch (e) { return ""; }
    }
    function houseTitle(url) {
      try {
        const parsed = new URL(url);
        const parts = parsed.pathname.split("/").filter(Boolean);
        const last = decodeURIComponent(parts[parts.length - 1] || "").replace(/[-_]+/g, " ").trim();
        if (!last || last.length > 42 || /property details|^\d+$/i.test(last)) return "";
        return last;
      } catch (e) { return ""; }
    }
    const houseUrl = param("house");
    const placeName = param("place").trim() || houseTitle(houseUrl);
    const houseLine = placeName || (houseUrl ? "one of Adam's houses" : "");
    function safePhoto(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return "";
        return parsed.toString();
      } catch (e) { return ""; }
    }
    function showPhoto(page) {
      const img = document.getElementById("shot-form");
      const frame = document.getElementById("shot-frame");
      const raw = page.toString();
      const shots = [
        "https://s.wordpress.com/mshots/v1/" + encodeURIComponent(raw) + "?w=900",
        "https://api.microlink.io/?url=" + encodeURIComponent(raw) + "&screenshot=true&meta=false&embed=screenshot.url"
      ];
      if (!img || !frame) return;
      let which = 0;
      let tries = 0;
      function place() {
        const src = safePhoto(shots[which]);
        if (!src) return;
        img.referrerPolicy = "no-referrer";
        img.alt = houseLine || "House";
        img.classList.toggle("fallback", which > 0);
        img.onload = function () {
          if (which === 0 && img.naturalWidth && img.naturalWidth < 800 && tries < 4) {
            tries += 1;
            setTimeout(function () {
              img.removeAttribute("src");
              img.src = src;
            }, 1500);
            return;
          }
          if (which === 0 && img.naturalWidth && img.naturalWidth < 800) {
            which = 1;
            tries = 0;
            place();
            return;
          }
          frame.classList.remove("hidden");
        };
        img.onerror = function () {
          frame.classList.add("hidden");
          if (which === 0) {
            which = 1;
            tries = 0;
            place();
          }
        };
        img.src = src;
      }
      place();
    }
    if (houseUrl) {
      try {
        const page = new URL(houseUrl);
        if (page.protocol === "https:" || page.protocol === "http:") showPhoto(page);
      } catch (e) {}
    } else {
      const img = document.getElementById("shot-form");
      const frame = document.getElementById("shot-frame");
      if (img && frame) {
        img.className = "adam";
        img.alt = "Adam";
        img.src = "adam.jpg";
        frame.classList.remove("hidden");
      }
    }
    if (houseLine) {
      const intro = document.querySelector("#form .intro");
      intro.textContent = "";
      const line = document.createElement("span");
      line.textContent = "You are looking at " + houseLine + ".";
      line.style.display = "block";
      line.style.marginBottom = "1em";
      intro.appendChild(line);
      intro.appendChild(document.createTextNode("First I need your name, telephone and email."));
    }
    let thread = null;
    let lastIds = {};
    let mqttClient = null;
    let pendingPub = [];

    function showErr(text) {
      const el = document.getElementById("err");
      el.textContent = text;
      el.classList.toggle("hidden", !text);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => {
        if (c === "&") return "\u0026amp;";
        if (c === "<") return "\u0026lt;";
        if (c === ">") return "\u0026gt;";
        if (c === '"') return "\u0026quot;";
        return "\u0026#39;";
      });
    }

    function visibleMessages(list) {
      return (list || []).filter((m, i) => !(i === 0 && m.who === "them" && String(m.text).includes("\n")));
    }

    function render() {
      const log = document.getElementById("log");
      const messages = visibleMessages(thread && thread.messages);
      log.innerHTML = messages.map((m) =>
        '<div class="msg ' + (m.who === "them" ? "me" : "them") + '">' + escapeHtml(m.text) + "</div>"
      ).join("");
      log.scrollTop = log.scrollHeight;
    }

    function openChat() {
      document.getElementById("form").classList.add("hidden");
      document.getElementById("chat").classList.remove("hidden");
      render();
    }

    function sameLast(who, text) {
      const list = (thread && thread.messages) || [];
      const last = list[list.length - 1];
      return !!last && last.who === who && last.text === text;
    }

    function makeId(email, name) {
      const key = String(email || name || "visitor")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      return "live." + (key || String(Date.now()));
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(thread)); } catch (e) {}
    }

    function mergeMessages(a, b) {
      const out = (a || []).slice();
      (b || []).forEach((msg) => {
        if (!out.some((item) => item.who === msg.who && item.text === msg.text)) out.push(msg);
      });
      return out;
    }

    function matches(incoming) {
      if (!thread || !incoming) return false;
      if (incoming.id && (incoming.id === thread.id || incoming.id === thread.altId)) return true;
      const email = String(incoming.email || "").trim().toLowerCase();
      if (email && email === String(thread.email || "").trim().toLowerCase()) return true;
      const name = String(incoming.name || "").trim().toLowerCase();
      if (name && name === String(thread.name || "").trim().toLowerCase()) return true;
      return false;
    }

    function publishOne(url, body, tries) {
      fetch(url, {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        headers: { "Content-Type": "text/plain" },
        body: body,
      }).catch(() => {
        if ((tries || 0) < 3) setTimeout(() => publishOne(url, body, (tries || 0) + 1), 700);
      });
    }

    function publish(event) {
      const body = JSON.stringify(event);
      BUSES.forEach((url) => publishOne(url, body, 0));
      if (!(mqttClient && mqttClient.connected)) {
        pendingPub.push(body);
        return;
      }
      try {
        mqttClient.publish(MQTT_TOPIC, body, { qos: 1 });
      } catch (e) {
        pendingPub.push(body);
      }
    }

    function pushThread() {
      if (!thread) return;
      publish({ type: "upsert", thread: thread });
      postDesk();
    }

    function meterId() {
      if (!thread || !thread.id) return "";
      return thread.started ? thread.id + "." + thread.started : thread.id;
    }

    function applyAccountThreads(rows) {
      if (!thread || !Array.isArray(rows)) return;
      const found = rows.find((row) => row && (row.id === thread.id || row.id === thread.altId))
        || rows.find((row) => matches(row));
      if (!found || !Array.isArray(found.messages)) return;
      const before = (thread.messages || []).length;
      thread.messages = mergeMessages(thread.messages, found.messages);
      if (found.id) thread.altId = found.id;
      if ((thread.messages || []).length === before) return;
      const last = thread.messages[thread.messages.length - 1];
      thread.teaser = last ? last.text : thread.teaser;
      save();
      render();
    }

    function postDesk() {
      if (!thread || !thread.id) return;
      const id = meterId();
      fetch("https://your-work-agent.vercel.app/api/adam-desk", {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          rev: Date.now(),
          base: 0,
          partial: true,
          threads: [thread],
          houses: [],
          seen: {},
          meter: id ? [{ id: id, month: monthKey() }] : [],
          droppedHouses: [],
        }),
      }).then((res) => (res.ok ? res.json() : null)).then((doc) => {
        if (doc) applyAccountThreads(doc.threads);
      }).catch(function () {});
    }

    async function pullDesk() {
      if (!thread) return;
      try {
        const res = await fetch("https://your-work-agent.vercel.app/api/adam-desk", { cache: "no-store", mode: "cors" });
        if (!res.ok) return;
        const doc = await res.json();
        applyAccountThreads(doc.threads);
      } catch (e) {}
    }

    function nudge() {
      pushThread();
      setTimeout(pushThread, 600);
      setTimeout(pushThread, 1800);
      setTimeout(pushThread, 4000);
    }

    const METER_KEY = "ywa.adam.meter.v1";
    let meterChats = [];
    let meterReady = false;
    let countQueued = false;
    try {
      const savedMeter = JSON.parse(localStorage.getItem(METER_KEY) || "");
      if (savedMeter && Array.isArray(savedMeter.chats)) meterChats = savedMeter.chats;
    } catch (e) {}

    function monthKey() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }

    function saveMeter() {
      try { localStorage.setItem(METER_KEY, JSON.stringify({ chats: meterChats })); } catch (e) {}
    }

    function publishMeter() {}

    function mergeMeter(chats) {
      if (!Array.isArray(chats)) return;
      chats.forEach((chat) => {
        if (!chat || !chat.id || String(chat.id).indexOf("live.") !== 0) return;
        if (meterChats.some((item) => item.id === chat.id)) return;
        meterChats.push({ id: chat.id, month: chat.month || monthKey() });
      });
      saveMeter();
    }

    function countThread() {
      if (!thread || !thread.id) return;
      if (meterChats.some((item) => item.id === thread.id)) return;
      const chat = { id: thread.id, month: monthKey() };
      meterChats.push(chat);
      saveMeter();
      publish({ type: "meter-add", id: chat.id, month: chat.month });
    }

    function flushCount() {
      meterReady = true;
      if (countQueued) countThread();
    }

    function applyEvent(event) {
      if (event && event.type === "meter") {
        mergeMeter(event.chats);
        if (!meterReady) flushCount();
        return;
      }
      if (!event || !event.type || !thread) return;
      if (event.type === "upsert" && event.thread && matches(event.thread)) {
        thread.messages = mergeMessages(thread.messages, event.thread.messages);
        thread.altId = event.thread.id;
        thread.teaser = thread.messages[thread.messages.length - 1] ? thread.messages[thread.messages.length - 1].text : thread.teaser;
        save();
        render();
        return;
      }
      if (event.type === "msg" && event.text && (event.id === thread.id || event.id === thread.altId || matches({ id: event.id }))) {
        if (sameLast(event.who, event.text)) return;
        thread.messages = (thread.messages || []).concat([{ who: event.who, text: event.text }]);
        thread.teaser = event.text;
        save();
        render();
      }
    }

    function parseLine(url, raw) {
      try {
        const wrap = JSON.parse(raw);
        if (wrap && wrap.id) lastIds[url] = wrap.id;
        if (wrap && wrap.event && wrap.event !== "message") return;
        applyEvent(JSON.parse(String(wrap.message || "")));
      } catch (e) {}
    }

    // Bus reads, grouped per server so ntfy.sh gets one request for both topics
    // (e.g. https://ntfy.sh/a,b). ntfy.sh allows 60 requests then 1 per 5s per IP,
    // so: live stream first, a poll every ~6s only when the stream is quiet,
    // back off on 429, and pause while the tab is hidden. MQTT and the desk pull
    // still deliver replies as before.
    const POLL_MS = 6000;
    const STREAM_FRESH_MS = 60000;
    const busGroups = (function () {
      const map = {};
      BUSES.forEach((url) => {
        const cut = url.lastIndexOf("/");
        const host = url.slice(0, cut);
        (map[host] = map[host] || []).push(url.slice(cut + 1));
      });
      return Object.keys(map).map((host) => ({
        url: host + "/" + map[host].join(","),
        since: "",
        seenIds: [],
        lastStream: 0,
        stream: null,
        backoff: 0,
        nextAt: 0,
      }));
    })();

    function takeBusLine(group, raw) {
      try {
        const wrap = JSON.parse(raw);
        if (!wrap) return;
        if (wrap.id) {
          if (group.seenIds.indexOf(wrap.id) >= 0) return;
          group.seenIds.push(wrap.id);
          if (group.seenIds.length > 300) group.seenIds.splice(0, 100);
        }
        if (wrap.time) group.since = String(wrap.time);
        if (wrap.event && wrap.event !== "message") return;
        applyEvent(JSON.parse(String(wrap.message || "")));
      } catch (e) {}
    }

    async function pullGroup(group, force) {
      const now = Date.now();
      if (now < group.nextAt) return;
      const live = group.stream && group.stream.readyState === 1 && now - group.lastStream < STREAM_FRESH_MS;
      if (live && !force) return;
      group.nextAt = now + POLL_MS - 500;
      const res = await fetch(group.url + "/json?poll=1&since=" + encodeURIComponent(group.since || "all"), {
        cache: "no-store",
        mode: "cors",
      });
      if (res.status === 429) {
        group.backoff = Math.min(group.backoff ? group.backoff * 2 : 30000, 300000);
        group.nextAt = Date.now() + group.backoff;
        return;
      }
      if (!res.ok) return;
      group.backoff = 0;
      const text = await res.text();
      text.split("\n").map((line) => line.trim()).filter(Boolean).forEach((line) => takeBusLine(group, line));
    }

    async function pull(force) {
      if (document.hidden) return;
      await Promise.all(busGroups.map((group) => pullGroup(group, force === true).catch(() => {})));
    }

    function openStreams() {
      busGroups.forEach((group) => {
        if (group.stream && group.stream.readyState !== 2) return;
        try {
          const stream = new EventSource(group.url + "/sse");
          group.stream = stream;
          stream.onopen = () => { group.lastStream = Date.now(); };
          stream.onmessage = (event) => { group.lastStream = Date.now(); takeBusLine(group, event.data); };
          stream.addEventListener("keepalive", () => { group.lastStream = Date.now(); });
          stream.addEventListener("open", () => { group.lastStream = Date.now(); });
        } catch (e) {}
      });
    }

    function startMqtt() {
      if (mqttClient) return;
      function bind() {
        if (!window.mqtt || mqttClient) return;
        try {
          mqttClient = window.mqtt.connect(MQTT_URL);
          mqttClient.on("connect", () => {
            mqttClient.subscribe(MQTT_TOPIC);
            const queued = pendingPub.splice(0);
            queued.forEach((body) => {
              try { mqttClient.publish(MQTT_TOPIC, body, { qos: 1 }); } catch (e) { pendingPub.push(body); }
            });
            pushThread();
            setTimeout(pushThread, 400);
            setTimeout(function () { if (!meterReady) flushCount(); }, 1200);
          });
          mqttClient.on("message", (_t, payload) => {
            try { applyEvent(JSON.parse(payload.toString())); } catch (e) {}
          });
        } catch (e) {}
      }
      if (window.mqtt) { bind(); return; }
      const s = document.createElement("script");
      s.src = "https://unpkg.com/mqtt@4.3.8/dist/mqtt.min.js";
      s.onload = bind;
      s.onerror = function () {};
      document.head.appendChild(s);
    }

    function hello(name) {
      const who = String(name || "there").trim().replace(/\s+/g, " ") || "there";
      if (houseLine) return "Hi " + who + ". You are looking at " + houseLine + ". What would you like to know?";
      return "Hi " + who + ". You’re now talking to Adam. Type your message below.";
    }

    function phoneNote(text) {
      const body = String(text || "").replace(/\s+/g, " ").trim().slice(0, 140);
      if (!body) return;
      fetch("https://ntfy.sh/", {
        method: "POST",
        mode: "cors",
        keepalive: true,
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          topic: "inmoandaluz",
          title: "Desk",
          message: body,
          click: "https://your-work-agent.vercel.app/desk",
          tags: ["speech_balloon"],
        }),
      }).catch(function () {});
    }

    const EMAIL_OK = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[A-Za-z]{2,}$/;
    let starting = false;
    document.getElementById("m").addEventListener("input", () => {
      const err = document.getElementById("err");
      if (!err.classList.contains("hidden") && EMAIL_OK.test(document.getElementById("m").value.trim())) showErr("");
    });
    const okBox = document.getElementById("ok");
    function syncConsent() {
      document.getElementById("start").disabled = starting || !okBox.checked;
      if (okBox.checked && document.getElementById("err").textContent === CONSENT_ERR) showErr("");
    }
    const CONSENT_ERR = "Please tick the box so Adam can keep your details to reply.";
    okBox.addEventListener("change", syncConsent);
    syncConsent();
    document.getElementById("start").onclick = () => {
      if (starting) return;
      if (!okBox.checked) {
        showErr(CONSENT_ERR);
        return;
      }
      const name = document.getElementById("n").value.trim();
      const phone = document.getElementById("t").value.trim();
      const email = document.getElementById("m").value.trim();
      if (!name || !phone || !email) {
        showErr("Enter your name, telephone and email.");
        return;
      }
      if (!EMAIL_OK.test(email)) {
        showErr("Please enter a valid email so Adam can reply");
        document.getElementById("m").focus();
        return;
      }
      starting = true;
      document.getElementById("start").disabled = true;
      showErr("");
      thread = {
        id: makeId(email, name),
        name: name,
        phone: phone,
        email: email,
        teaser: houseLine || "New chat from Talk to Adam",
        meta: placeName || (houseUrl ? "House" : "Talk to Adam"),
        takenOver: false,
        started: Date.now(),
        consent: true,
        consentAt: new Date().toISOString(),
        messages: [
          { who: "them", text: name },
          { who: "me", text: hello(name) },
        ],
      };
      save();
      nudge();
      openChat();
      countQueued = true;
      if (meterReady) countThread();
    };

    function send() {
      const box = document.getElementById("draft");
      const text = box.value.trim();
      if (!text || !thread) return;
      box.value = "";
      if (sameLast("them", text)) return;
      thread.messages.push({ who: "them", text: text });
      thread.teaser = text;
      save();
      render();
      nudge();
    }

    document.getElementById("send").onclick = send;
    document.getElementById("draft").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    });

    const freshVisit = /(?:^|[?&])new=1(?:&|$)/.test(location.search);
    const reloaded = (performance.getEntriesByType("navigation")[0] || {}).type === "reload";
    if (freshVisit && !reloaded) {
      try { localStorage.removeItem(KEY); } catch (e) {}
    } else try {
      const saved = localStorage.getItem(KEY);
      if (saved) {
        thread = JSON.parse(saved);
        if (thread && thread.id) {
          if (thread.email) thread.id = makeId(thread.email, thread.name);
          const opener = (thread.messages || []).find((m) => m.who === "me");
          if (opener && /villa|co[ií]n|what do you want to know/i.test(opener.text)) {
            opener.text = hello(thread.name);
          }
          save();
          openChat();
          pushThread();
        }
      }
    } catch (e) {}

    startMqtt();
    openStreams();
    pull(true);
    pullDesk();
    setInterval(pull, POLL_MS);
    setInterval(function () { if (!document.hidden) pullDesk(); }, 2000);
    setInterval(openStreams, 30000);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      openStreams();
      pull(true);
      pullDesk();
    });

    let touchY = 0;
    document.addEventListener("touchstart", (e) => {
      touchY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchmove", (e) => {
      const y = e.touches[0].clientY;
      const pullingDown = y - touchY > 16;
      touchY = y;
      const target = e.target;
      if (target && target.closest && target.closest("button, input, textarea, a, label")) return;
      const log = document.getElementById("log");
      const sheet = document.querySelector("#form .sheet");
      const box = log && log.contains(target) ? log : sheet && sheet.contains(target) ? sheet : null;
      if (pullingDown && (!box || box.scrollTop <= 0)) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
